# =========================================================
# Blog Column metadata
# The single source of truth for column display info.
#
# key      = stable column id  (must match the folder name under
#            source/_posts/<id>/, or the `column:` front-matter value)
# name     = display name shown on pages
# cover    = card cover image path (falls back to defaults.cover)
# description = card description (falls back to defaults.description)
#
# New column: create a folder source/_posts/<id>/ and (optionally)
# add an entry here for its name / cover / description.
# =========================================================

defaults:
  cover: /images/projects/coursemate.png
  description: Articles, notes and ideas collected around this topic.

columns:
  ai-basic:
    name: AI基础
    description: Core concepts, foundations and essential ideas in artificial intelligence.
  diffusion:
    name: Diffusion
    description: Notes and explorations on diffusion models, generative modeling and related techniques.
  paper-weekly:
    name: PaperWeekly
    description: Weekly notes, discussions and interesting ideas from recently read research papers.
